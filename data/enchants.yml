# 잠재능력
# 장비에 무작위로 붙는 추가 효과. for = 붙는 장비 종류.
# 생성: tools/export_commission.py (2026-10-09) — 손으로 고치지 말고 다시 생성

rules:
  npc: 잠재능력 재설정 NPC
  grades:
  - 일반
  - 희귀
  - 영웅
  - 전설
  lines_per_grade:
    일반: 1
    희귀: 1
    영웅: 2
    전설: 3
  grade_up_chance:
    일반→희귀: 25%
    희귀→영웅: 12%
    영웅→전설: 5%
    전설(최고): 0%
  cost: 100G + 등급 순번(0~3)×100G, 뒤틀린 청금석 1개 + 등급 순번×1개 (도구는 ×0.5)
  line_lock: 잠근 줄은 유지하고 나머지만 다시 뽑음. 1줄 잠글 때마다 기본 골드 ×1.0 추가, 잠그는 동안 등급업 없음, 모든 줄은 못 잠금
  grade_bonus: 아이템 등급이 잠재능력 등급보다 한 단계 높을 때마다 효과 +10%
  note: effect_at_max는 최고 레벨·등급 보너스 없음(배율 1.0) 기준입니다. any_grade=true면 아이템 등급과 상관없이 나옵니다.
