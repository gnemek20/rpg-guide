# 플레이어 명령어
# 관리자·내부 명령은 뺐습니다. aliases는 같은 기능의 다른 이름입니다.
# 생성: tools/export_commission.py (2026-10-09) — 손으로 고치지 말고 다시 생성

commands:
- command: /메뉴
  aliases:
  - /m
  - /menu
  description: RPG 메인 메뉴를 엽니다.
- command: /상점
  aliases:
  - /shop
  description: 판매 NPC 안내를 표시합니다 (상점은 NPC 전용).
- command: /재료상점
  aliases:
  - /matshop
  description: 재료 상점 NPC 안내를 표시합니다 (재료상점은 NPC 전용).
- command: /강화
  aliases:
  - /enhance
  - /enchance
  description: 강화 NPC 안내를 표시합니다 (강화는 NPC 전용).
- command: /도감
  aliases:
  - /collection
  description: 도감을 엽니다.
- command: /재료
  aliases:
  - /재료도감
  - /materials
  description: 재료 도감(얻는 곳·쓰이는 곳)을 엽니다.
- command: /업적
  aliases:
  - /title
  - /achievement
  description: 업적/칭호 목록을 엽니다.
- command: /탑
  aliases:
  - /tower
  description: 시련의 탑에 입장합니다.
- command: /파견
  aliases:
  - /expedition
  description: 파견대 GUI를 엽니다.
- command: /장비
  aliases:
  - /equipment
  - /equip
  description: 장비창을 엽니다 (갑옷·목걸이·벨트·반지·룬).
- command: /랭킹
  aliases:
  - /ranking
  - /rank
  description: 랭킹(시련의 탑·숙련도·골드·처치 수)을 엽니다.
- command: /출석
  aliases:
  - /attendance
  description: 출석 보상 달력을 엽니다 (접속해 있으면 자동 지급).
- command: /거래
  aliases:
  - /trade
  description: 다른 유저와 아이템/골드를 거래합니다. /거래 <닉네임>, /거래 수락, /거래 거절
- command: /섬
  aliases:
  - /island
  description: 소속 섬으로 바로 이동합니다. /섬 도움말, /섬 허브
- command: /spawn
  aliases:
  - /넴주
  description: 마을로 바로 이동합니다.
- command: /창고
  aliases:
  - /vault
  - /storage
  description: 개인 창고를 엽니다.
- command: /프리셋
  aliases:
  - /preset
  description: 장비 세트 프리셋을 엽니다.
- command: /귀환
  aliases:
  - /recall
  description: 귀환석을 사용해 마을로 돌아갑니다.
- command: /가이드
  aliases:
  - /guide
  - /wiki
  - /위키
  description: 웹 가이드(공지·점검, 아이템·장비 트리, 시스템 설명, 몬스터 도감) 주소를 엽니다.
- command: /이의제기
  aliases:
  - /appeal
  description: 제재를 받은 동안 이의를 제기합니다. 내용 없이 쓰면 제재 정보를 봅니다.
- command: /피드백
  aliases:
  - /feedback
  description: 개선 의견을 운영자에게 전달합니다.
- command: /신고
  aliases:
  - /report
  - /bugreport
  - /버그신고
  description: 버그를 운영자에게 접수합니다. /신고 내용
- command: /낚시
  aliases:
  - /fishing
  - /낚시일지
  description: 낚시 일지(어종 기록·조건·생선 판매)를 엽니다.
- command: /의뢰
  aliases:
  - /daily
  - /일일퀘스트
  description: 일일·주간 의뢰 창을 엽니다.
- command: /파티
  aliases:
  - /party
  description: 파티를 만들고 초대합니다(보스전·시련의 탑용, 준비 중).
- command: /마법
  aliases:
  - /spell
  - /spellbook
  description: 마법 각인 NPC 안내를 표시합니다 (마법서는 NPC 전용).
- command: /rpg
  aliases:
  - /tutorial
  description: 튜토리얼을 다시 봅니다.
keys:
- key: Shift + F
  description: 무기에 각인한 마법 슬롯을 바꿉니다.
- key: 우클릭(지팡이·마법 무기)
  description: 선택한 마법을 시전합니다.
